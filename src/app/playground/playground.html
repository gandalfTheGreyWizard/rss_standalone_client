<mat-icon [fontIcon]="topNavIcon" (click)="toggleSideNav()"></mat-icon>
<mat-sidenav-container class="sideNavContainer">
  <mat-sidenav [(opened)]="sideNavToggleState" (closedStart)="closeSideNav()" (openedStart)="openSideNav">
    <mat-nav-list >
      <a
          mat-list-item
          (click)="addTarget()"
          class="sideNavElements"
        >
      <mat-icon matListItemIcon>add_link</mat-icon>
      <div> Add Target </div>
      </a>
    </mat-nav-list>
    </mat-sidenav>
  <mat-sidenav-content><app-playground-content [playgroundInput]="tempPlaygroundContent"></app-playground-content></mat-sidenav-content>
</mat-sidenav-container>
