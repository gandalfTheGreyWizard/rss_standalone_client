<div class="modalContainer">
    <mat-dialog-content>
      <div class="formContainer">
        <form [formGroup]="loginForm" (ngSubmit)="login()" class="formgroupelement">
          <mat-form-field appearance="fill" class="loginFormFields">
            <mat-label>Email</mat-label>
            <input matInput placeholder="Placeholder" formControlName="email" >
            <mat-icon matSuffix>email id</mat-icon>
          </mat-form-field><br>
          <mat-form-field appearance="fill" class="loginFormFields">
            <mat-label>Password</mat-label>
            <input matInput [type]="'password'" placeholder="Placeholder" formControlName="password" >
            <mat-icon matSuffix>password</mat-icon>
          </mat-form-field><br>
          <button
            type="submit"
            class="addTarget"
            matButton="elevated"
            matTooltip="try to login"
            mat-dialog-close
            (click)="login()"
            >Login
          </button>
        </form>
      </div>
    </mat-dialog-content>
</div>
