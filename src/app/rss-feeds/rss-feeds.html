<div class="topNavContainer">
  <mat-icon [fontIcon]="navigationIcon" (click)="toggleSideNav()"></mat-icon>
</div>
<mat-sidenav-container>
  <mat-sidenav mode="side" [(opened)]="sideNavToggleState">
    <app-sidenav-container (addTargetEmitter)="triggerAddTargetModal()" (showConfigEmitter)="showConfig()" (saveConfigEmitter)="saveConfig()"></app-sidenav-container>
  </mat-sidenav>
  <mat-sidenav-content class="sideNavContentContainer" (click)="closeSideNav()">
    <mat-grid-list cols="4" rowHeight="100px">
      @for (eachFeed of feeds; track eachFeed['id']) {
          <mat-grid-tile [colspan]="1" [rowspan]="4" class="contentContainer">
            <mat-card class="contentCard" appearance="outlined">
            <mat-card-header>
              <mat-card-title>{{eachFeed['title']}}</mat-card-title>
            </mat-card-header>
            <mat-card-content class="content">
              {{eachFeed['content']}}
            </mat-card-content>
          </mat-card>
            <!--<div class="content">-->
              <!--<h3>{{eachFeed['title']}}</h3>-->
              <!--<div [innerHtml]="eachFeed['content']"></div>-->
            <!--</div>-->
          </mat-grid-tile>
          <!--@if (eachFeed['content:encoded']) {-->
            <!--<mat-grid-tile [colspan]="4" [rowspan]="6" class="extendedContentContainer">-->
                <!--<div [innerHtml]="eachFeed['content:encoded']" class="extendedContent"></div>-->
            <!--</mat-grid-tile>-->
          <!--}-->
      }
    </mat-grid-list>
  </mat-sidenav-content>
</mat-sidenav-container>
